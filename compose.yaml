name: media

x-backend: &backend
  image: ${COMPOSE_PROJECT_NAME:-media}-backend:local
  build: .
  init: true
  environment:
    PGHOST: db
    PGPORT: "5432"
    PGUSER: media
    PGPASSWORD: ${MEDIA_DB_PASSWORD:?Run sh scripts/setup.sh first}
    MEDIA_STATE_DIR: /var/lib/media/state
    MEDIA_OUTPUT_DIR: /var/lib/media/outputs
    MEDIA_PROXY_BRIDGE_BINARY: /usr/local/bin/proxy-tester
  volumes:
    - collector-state:/var/lib/media/state
    - collection-output:/var/lib/media/outputs

services:
  db:
    image: postgres:18.6-bookworm
    command: ["postgres", "-c", "shared_buffers=${MEDIA_DB_SHARED_BUFFERS:-128MB}", "-c", "max_wal_size=${MEDIA_DB_MAX_WAL_SIZE:-4GB}", "-c", "checkpoint_timeout=15min"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run sh scripts/setup.sh first}
      MEDIA_DB_PASSWORD: ${MEDIA_DB_PASSWORD:?Run sh scripts/setup.sh first}
    volumes:
      - database:/var/lib/postgresql
      - ./docker/init-db.sh:/docker-entrypoint-initdb.d/10-media.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d postgres"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s

  staging-init:
    image: postgres:18.6-bookworm
    environment:
      PGHOST: db
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD:?Run sh scripts/setup.sh first}
    command: ["psql", "-X", "-v", "ON_ERROR_STOP=1", "-d", "postgres", "-f", "/setup/ensure-staging.sql"]
    volumes:
      - ./docker/ensure-staging.sql:/setup/ensure-staging.sql:ro
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  init:
    <<: *backend
    command: ["python", "manage.py", "migrate"]
    depends_on:
      staging-init:
        condition: service_completed_successfully
    restart: "no"

  proxy-service:
    <<: *backend
    profiles: ["tools"]
    command: ["python", "proxy_service.py", "refresh"]
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGUSER: media
      PGPASSWORD: ${MEDIA_DB_PASSWORD:?Run sh scripts/setup.sh first}
      MEDIA_STATE_DIR: /var/lib/media/state
      MEDIA_OUTPUT_DIR: /var/lib/media/outputs
      MEDIA_PROXY_BRIDGE_BINARY: /usr/local/bin/proxy-tester
      MEDIA_PROXY_REPOSITORY: ${MEDIA_PROXY_REPOSITORY:-mahmudvibecoding/proxy-catalog}
      MEDIA_PROXY_TEST_CONCURRENCY: ${MEDIA_PROXY_TEST_CONCURRENCY:-0}
      MEDIA_PROXY_TEST_WORKERS: ${MEDIA_PROXY_TEST_WORKERS:-0}
      MEDIA_PROXY_SOURCE_CONCURRENCY: ${MEDIA_PROXY_SOURCE_CONCURRENCY:-128}
      MEDIA_PROXY_SOURCE_PER_HOST: ${MEDIA_PROXY_SOURCE_PER_HOST:-16}
      MEDIA_PROXY_SOURCE_GITHUB_CONCURRENCY: ${MEDIA_PROXY_SOURCE_GITHUB_CONCURRENCY:-32}
      MEDIA_PROXY_SOURCE_PARSE_WORKERS: ${MEDIA_PROXY_SOURCE_PARSE_WORKERS:-0}
    depends_on:
      init:
        condition: service_completed_successfully
    restart: "no"
    stop_grace_period: 30s

  backend:
    <<: *backend
    profiles: ["tools"]
    depends_on:
      init:
        condition: service_completed_successfully
    restart: "no"

  discovery:
    <<: *backend
    profiles: ["tools"]
    command: ["python", "discover_all.py"]
    depends_on:
      init:
        condition: service_completed_successfully
    restart: "no"
    stop_grace_period: 45s
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576

  metadata:
    <<: *backend
    profiles: ["tools"]
    command: ["python", "collect_metadata_all.py"]
    depends_on:
      init:
        condition: service_completed_successfully
    restart: "no"
    stop_grace_period: 45s
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576

  channels:
    <<: *backend
    profiles: ["tools"]
    command: ["python", "collect_channels.py"]
    depends_on:
      init:
        condition: service_completed_successfully
    restart: "no"
    stop_grace_period: 45s
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576

  dashboard-setup:
    image: ${COMPOSE_PROJECT_NAME:-media}-backend:local
    profiles: ["tools"]
    environment:
      PGHOST: db
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD:?Run sh scripts/setup.sh first}
      MEDIA_DASHBOARD_DB_PASSWORD: ${MEDIA_DASHBOARD_DB_PASSWORD:-}
    command: ["python", "configure_dashboard.py", "grant"]
    restart: "no"

  dashboard:
    image: ${COMPOSE_PROJECT_NAME:-media}-backend:local
    profiles: ["dashboard"]
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=1777"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    environment:
      PGHOST: db
      PGUSER: media_dashboard
      PGPASSWORD: ${MEDIA_DASHBOARD_DB_PASSWORD:-}
      MEDIA_DASHBOARD_USERNAME: ${MEDIA_DASHBOARD_USERNAME:-mahmud}
      MEDIA_DASHBOARD_PASSWORD_HASH: ${MEDIA_DASHBOARD_PASSWORD_HASH:-}
      MEDIA_DASHBOARD_SECRET: ${MEDIA_DASHBOARD_SECRET:-}
      MEDIA_DASHBOARD_SECURE_COOKIES: ${MEDIA_DASHBOARD_SECURE_COOKIES:-0}
    ports:
      - "127.0.0.1:${MEDIA_DASHBOARD_PORT:-8050}:8080"
    command: ["python", "-m", "uvicorn", "dashboard.app:app", "--host", "0.0.0.0", "--port", "8080", "--no-proxy-headers", "--limit-concurrency", "64"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5)"]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 15s
    depends_on:
      db:
        condition: service_healthy

volumes:
  database:
  collector-state:
  collection-output:
